name: Action trial (SHA-pinned)

# A controlled trial of the MergeLatch advisory Action as GitHub downloads it
# by a full commit SHA, separately from the checkout being inspected. It never
# uses `uses: ./`.
#
# This is advisory and is not a security gate or a required check. It runs on
# pull_request with a read-only token and no secrets. It scans only inert
# fixtures and this repository's own workflow files as data. The Action under
# trial is the reviewed commit named below (the merge commit of pull request #21, which stops the whole build process tree on timeout, F-08),
# not the code in this pull request.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: action-trial-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The reviewed commit that GitHub downloads and runs as the Action.
  ACTION_SHA: c5296cef5fd3ffc36f1b8f0649e6491050606275
  # SHA-256 of files at that commit, to show the downloaded directory is the reviewed one.
  ACTION_YML_SHA256: e2cf315032bd24871e6c70524d7bb245b1e73dc5ad8610693834c327c5f2e17e
  HELPER_SHA256: 6d6620ad6f69056684bb0c8265caf03829a6074e78f5a07efed39ba8935d1970
  BUILD_SH_SHA256: 05b93ff6ae321c7e93f1fe8c694bd752e7844482906bb1a51cb5deeec331d138
  LOCKFILE_SHA256: 0080ec065c655c4478d7135f84666b9aa0de1e6db6c418dfc39e01a461dde053

jobs:
  trial:
    name: SHA-pinned Action trial
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the pull request (the content being inspected)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # First, so the scanner is built on a cold runner with hostile inherited
      # settings present. Nothing in this workspace is ever built or run.
      - name: Scan fixtures full of hostile build files, with hostile settings inherited
        id: hostile
        uses: MergeLatch/mergelatch@c5296cef5fd3ffc36f1b8f0649e6491050606275
        env:
          BASH_ENV: ${{ github.workspace }}/fixtures/action-hostile/bash_env.sh
          CARGO_HOME: ${{ github.workspace }}/fixtures/action-hostile/cargo-home
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: ${{ github.workspace }}/fixtures/action-hostile/evil-linker.sh
          RUSTC_WRAPPER: ${{ github.workspace }}/fixtures/action-hostile/evil-wrapper.sh
          RUSTUP_DIST_SERVER: http://127.0.0.1:9
          RUSTFLAGS: -C link-arg=-fno-such-flag
        with:
          scan-directory: fixtures/action-hostile

      - name: Control, BASH_ENV in an ordinary bash step
        env:
          BASH_ENV: ${{ github.workspace }}/fixtures/action-hostile/control_bash_env.sh
        run: echo "ordinary bash step"

      - name: Scan this repository (clean expected)
        id: clean
        uses: MergeLatch/mergelatch@c5296cef5fd3ffc36f1b8f0649e6491050606275

      - name: Scan a fixture with a finding
        id: findings
        uses: MergeLatch/mergelatch@c5296cef5fd3ffc36f1b8f0649e6491050606275
        with:
          scan-directory: fixtures/gha-permissions/workflow-write-all

      - name: Scan a malformed fixture (incomplete expected)
        id: incomplete
        uses: MergeLatch/mergelatch@c5296cef5fd3ffc36f1b8f0649e6491050606275
        with:
          scan-directory: fixtures/gha-permissions/malformed

      - name: Scan a directory that does not exist (error expected)
        id: missing
        continue-on-error: true
        uses: MergeLatch/mergelatch@c5296cef5fd3ffc36f1b8f0649e6491050606275
        with:
          scan-directory: fixtures/does-not-exist

      - name: Scan with a loader variable in the environment (early failure expected)
        id: loader
        continue-on-error: true
        uses: MergeLatch/mergelatch@c5296cef5fd3ffc36f1b8f0649e6491050606275
        env:
          LD_PRELOAD: /nonexistent/mergelatch-test-preload.so
        with:
          scan-directory: fixtures/action-hostile

      # Extra checkouts of other revisions into subdirectories, to test the
      # revision check. They are scanned as data like everything else.
      - name: Check out the pull request head into a subdirectory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head-checkout
          persist-credentials: false

      - name: Check out the base commit into a subdirectory (a stale revision)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: stale-checkout
          persist-credentials: false

      - name: Scan the head checkout (head revision expected)
        id: head
        uses: MergeLatch/mergelatch@c5296cef5fd3ffc36f1b8f0649e6491050606275
        with:
          scan-directory: head-checkout

      - name: Scan the stale checkout (revision mismatch expected)
        id: stale
        continue-on-error: true
        uses: MergeLatch/mergelatch@c5296cef5fd3ffc36f1b8f0649e6491050606275
        with:
          scan-directory: stale-checkout

      # A pull_request scan whose revision cannot be verified must be an error
      # even though the real checkout above has a valid merge HEAD. These are
      # inert text files in sub-directories (GitHub never runs them as workflows)
      # and are only read as data. Each directory has a `.git` FILE that points
      # nowhere, as a submodule or worktree would, so its own revision cannot be
      # read and it must not borrow the parent's.
      - name: Create inert nested checkouts whose revision cannot be read
        run: |
          set -euo pipefail
          mkdir unverified-nested unverified-nested-findings
          cp -R fixtures/gha-permissions/safe-read-only/.github unverified-nested/.github
          cp -R fixtures/gha-permissions/workflow-write-all/.github unverified-nested-findings/.github
          for dir in unverified-nested unverified-nested-findings; do
            printf 'gitdir: ../nowhere\n' > "${dir}/.git"
          done

      - name: Scan a clean nested checkout with no readable revision (error expected, the step fails on purpose)
        id: unverified
        continue-on-error: true
        uses: MergeLatch/mergelatch@c5296cef5fd3ffc36f1b8f0649e6491050606275
        with:
          scan-directory: unverified-nested

      - name: Scan a nested checkout with a finding and no readable revision (error expected, not findings)
        id: unverified_findings
        continue-on-error: true
        uses: MergeLatch/mergelatch@c5296cef5fd3ffc36f1b8f0649e6491050606275
        with:
          scan-directory: unverified-nested-findings

      - name: Verify the trust boundary and provenance
        env:
          WORKSPACE: ${{ github.workspace }}
          EXPECTED_MERGE: ${{ github.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HOSTILE_STATUS: ${{ steps.hostile.outputs.status }}
          HOSTILE_IGNORED: ${{ steps.hostile.outputs.ignored-environment-count }}
          CLEAN_STATUS: ${{ steps.clean.outputs.status }}
          CLEAN_EXIT: ${{ steps.clean.outputs.scanner-exit-code }}
          CLEAN_FILES: ${{ steps.clean.outputs.files-inspected }}
          CLEAN_SOURCE: ${{ steps.clean.outputs.scanner-source }}
          CLEAN_PINNED: ${{ steps.clean.outputs.action-pinned }}
          CLEAN_ACTION_REVISION: ${{ steps.clean.outputs.action-revision }}
          HEAD_ACTION_REVISION: ${{ steps.head.outputs.action-revision }}
          HEAD_SOURCE: ${{ steps.head.outputs.scanner-source }}
          STALE_ACTION_REVISION: ${{ steps.stale.outputs.action-revision }}
          MISSING_REVISION_CHECK: ${{ steps.missing.outputs.revision-check }}
          MISSING_SOURCE: ${{ steps.missing.outputs.scanner-source }}
          MISSING_ACTION_REVISION: ${{ steps.missing.outputs.action-revision }}
          LOADER_OUTCOME: ${{ steps.loader.outcome }}
          LOADER_STATUS: ${{ steps.loader.outputs.status }}
          LOADER_REVISION_CHECK: ${{ steps.loader.outputs.revision-check }}
          LOADER_SOURCE: ${{ steps.loader.outputs.scanner-source }}
          LOADER_PINNED: ${{ steps.loader.outputs.action-pinned }}
          LOADER_ACTION_REVISION: ${{ steps.loader.outputs.action-revision }}
          CLEAN_REVISION_CHECK: ${{ steps.clean.outputs.revision-check }}
          CLEAN_REVISION: ${{ steps.clean.outputs.scanned-revision }}
          CLEAN_VERSION: ${{ steps.clean.outputs.scanner-version }}
          CLEAN_RULESET: ${{ steps.clean.outputs.ruleset }}
          FINDINGS_STATUS: ${{ steps.findings.outputs.status }}
          FINDINGS_COUNT: ${{ steps.findings.outputs.findings-count }}
          FINDINGS_EXIT: ${{ steps.findings.outputs.scanner-exit-code }}
          FINDINGS_OUTCOME: ${{ steps.findings.outcome }}
          INCOMPLETE_STATUS: ${{ steps.incomplete.outputs.status }}
          INCOMPLETE_COUNT: ${{ steps.incomplete.outputs.incomplete-count }}
          INCOMPLETE_EXIT: ${{ steps.incomplete.outputs.scanner-exit-code }}
          INCOMPLETE_OUTCOME: ${{ steps.incomplete.outcome }}
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
          MISSING_STATUS: ${{ steps.missing.outputs.status }}
          HEAD_STATUS: ${{ steps.head.outputs.status }}
          HEAD_REVISION_CHECK: ${{ steps.head.outputs.revision-check }}
          HEAD_REVISION: ${{ steps.head.outputs.scanned-revision }}
          STALE_OUTCOME: ${{ steps.stale.outcome }}
          STALE_STATUS: ${{ steps.stale.outputs.status }}
          STALE_REVISION_CHECK: ${{ steps.stale.outputs.revision-check }}
          FINDINGS_REVISION_CHECK: ${{ steps.findings.outputs.revision-check }}
          FINDINGS_REVISION: ${{ steps.findings.outputs.scanned-revision }}
          INCOMPLETE_REVISION_CHECK: ${{ steps.incomplete.outputs.revision-check }}
          UNVERIFIED_OUTCOME: ${{ steps.unverified.outcome }}
          UNVERIFIED_STATUS: ${{ steps.unverified.outputs.status }}
          UNVERIFIED_REVISION_CHECK: ${{ steps.unverified.outputs.revision-check }}
          UNVERIFIED_REVISION: ${{ steps.unverified.outputs.scanned-revision }}
          UNVERIFIED_SOURCE: ${{ steps.unverified.outputs.scanner-source }}
          UNVERIFIED_ACTION_REVISION: ${{ steps.unverified.outputs.action-revision }}
          UNVERIFIED_FINDINGS_OUTCOME: ${{ steps.unverified_findings.outcome }}
          UNVERIFIED_FINDINGS_STATUS: ${{ steps.unverified_findings.outputs.status }}
          UNVERIFIED_FINDINGS_COUNT: ${{ steps.unverified_findings.outputs.findings-count }}
          UNVERIFIED_FINDINGS_REVISION_CHECK: ${{ steps.unverified_findings.outputs.revision-check }}
          UNVERIFIED_FINDINGS_REVISION: ${{ steps.unverified_findings.outputs.scanned-revision }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=Trial::$1"; exit 1; }

          # 1. GitHub downloaded the Action separately, outside the workspace, at the reviewed commit.
          action_dir="${RUNNER_WORKSPACE}/../_actions/MergeLatch/mergelatch/${ACTION_SHA}"
          action_dir="$(cd "${action_dir}" && pwd -P)" || fail "the downloaded Action directory does not exist"
          case "${action_dir}/" in "${WORKSPACE}/"*) fail "the Action directory is inside the workspace";; esac
          check() { # file expected-sha256
            actual="$(sha256sum "${action_dir}/$1" | cut -d' ' -f1)"
            [ "${actual}" = "$2" ] || fail "downloaded $1 is not the reviewed file"
          }
          check action.yml "${ACTION_YML_SHA256}"
          check action/mergelatch_action.py "${HELPER_SHA256}"
          check action/build.sh "${BUILD_SH_SHA256}"
          check Cargo.lock "${LOCKFILE_SHA256}"
          [ -d "${action_dir}/crates/core/src" ] || fail "scanner source missing from the Action directory"

          # 2. Provenance reported by the Action itself.
          [ "${CLEAN_SOURCE}" = action-checkout ] || fail "scanner-source was not action-checkout"
          [ "${CLEAN_PINNED}" = true ] || fail "action-pinned was not true"
          # The corrected provenance reporting: the full SHA the runner loaded the Action from.
          [ "${CLEAN_ACTION_REVISION}" = "${ACTION_SHA}" ] || fail "action-revision was not the expected full commit SHA"
          [ "${HEAD_ACTION_REVISION}" = "${ACTION_SHA}" ] || fail "head scan action-revision was wrong"
          [ "${STALE_ACTION_REVISION}" = "${ACTION_SHA}" ] || fail "stale scan action-revision was wrong"
          [ "${HEAD_SOURCE}" = action-checkout ] || fail "head scan scanner-source was wrong"
          [ -n "${CLEAN_VERSION}" ] || fail "no scanner version reported"
          [ "${CLEAN_RULESET}" = mergelatch-builtin-1 ] || fail "unexpected ruleset"

          # 3. Scenarios.
          [ "${CLEAN_STATUS}" = clean ] || fail "repository scan was not clean"
          [ "${CLEAN_EXIT}" = 0 ] || fail "clean exit code was not 0"
          [ "${CLEAN_FILES}" -ge 1 ] || fail "no workflow files were inspected"
          [ "${CLEAN_REVISION_CHECK}" = matches-merge ] || fail "revision check was not matches-merge"
          [ "${CLEAN_REVISION}" = "${EXPECTED_MERGE}" ] || fail "scanned revision is not the merge commit"
          [ "${FINDINGS_OUTCOME}" = success ] || fail "advisory step with findings did not succeed"
          [ "${FINDINGS_STATUS}" = findings ] || fail "write-all fixture did not give findings"
          [ "${FINDINGS_COUNT}" = 1 ] || fail "unexpected finding count"
          [ "${FINDINGS_EXIT}" = 1 ] || fail "exit code 1 was not preserved"
          [ "${INCOMPLETE_OUTCOME}" = success ] || fail "advisory step with an incomplete scan did not succeed"
          [ "${INCOMPLETE_STATUS}" = incomplete ] || fail "malformed fixture was not incomplete"
          [ "${INCOMPLETE_COUNT}" = 1 ] || fail "unexpected incomplete count"
          [ "${INCOMPLETE_EXIT}" = 2 ] || fail "exit code 2 was not preserved"
          [ "${MISSING_OUTCOME}" = failure ] || fail "a missing directory did not fail the step"
          [ "${MISSING_STATUS}" = error ] || fail "a missing directory was not reported as an error"
          # No scan result was compared, so no revision check may be claimed.
          [ "${MISSING_REVISION_CHECK}" = not-checked ] || fail "an error before a scan did not report not-checked"
          [ "${MISSING_SOURCE}" = action-checkout ] || fail "a late preparation error lost the scanner source"
          [ "${MISSING_ACTION_REVISION}" = "${ACTION_SHA}" ] || fail "a failed run did not report the Action revision"
          # An error before the scanner source is known must not claim a pinned source.
          [ "${LOADER_OUTCOME}" = failure ] || fail "a loader variable did not fail the step"
          [ "${LOADER_STATUS}" = error ] || fail "a loader variable was not reported as an error"
          [ "${LOADER_REVISION_CHECK}" = not-checked ] || fail "an early failure did not report not-checked"
          [ "${LOADER_SOURCE}" = unknown ] || fail "an early failure did not report scanner-source unknown"
          [ "${LOADER_PINNED}" = true ] || fail "the loaded Action was not reported as pinned"
          [ "${LOADER_ACTION_REVISION}" = "${ACTION_SHA}" ] || fail "an early failure lost the Action revision"
          [ "${HEAD_STATUS}" = clean ] || fail "head checkout scan was not clean"
          [ "${HEAD_REVISION_CHECK}" = matches-head ] || fail "head checkout was not matches-head"
          [ "${HEAD_REVISION}" = "${EXPECTED_HEAD}" ] || fail "head revision differs from the pull request head"
          [ "${STALE_OUTCOME}" = failure ] || fail "a stale revision did not fail the step"
          [ "${STALE_STATUS}" = error ] || fail "a stale revision was not reported as an error"
          [ "${STALE_REVISION_CHECK}" = mismatch ] || fail "a stale revision was not reported as a mismatch"

          # 3b. Sub-directory scans are verified through the workspace checkout's own HEAD.
          [ "${FINDINGS_REVISION_CHECK}" = matches-merge ] || fail "a fixture sub-directory scan was not verified as matches-merge"
          [ "${FINDINGS_REVISION}" = "${EXPECTED_MERGE}" ] || fail "a fixture sub-directory scan reported a different revision"
          [ "${INCOMPLETE_REVISION_CHECK}" = matches-merge ] || fail "the incomplete fixture scan was not verified as matches-merge"

          # 3c. EXPECTED ACTION FAILURES. The two steps above are meant to fail: this job passes only
          # because every assertion below confirms that they failed in exactly this way. An unreadable
          # nested revision is an error and never clean, findings, or incomplete, and the parent
          # checkout's valid merge HEAD must not stand in for it.
          [ "${UNVERIFIED_OUTCOME}" = failure ] || fail "an unverifiable revision did not fail the Action step"
          [ "${UNVERIFIED_STATUS}" = error ] || fail "an unverifiable revision was not reported as an error"
          [ "${UNVERIFIED_REVISION_CHECK}" = unavailable ] || fail "the unverifiable revision was not reported as unavailable"
          [ -z "${UNVERIFIED_REVISION}" ] || fail "an unverifiable scan reported a scanned revision"
          [ "${UNVERIFIED_SOURCE}" = action-checkout ] || fail "the unverifiable scan lost the scanner source"
          [ "${UNVERIFIED_ACTION_REVISION}" = "${ACTION_SHA}" ] || fail "the unverifiable scan lost the Action revision"
          [ "${UNVERIFIED_FINDINGS_OUTCOME}" = failure ] || fail "an unverifiable revision with a finding did not fail the step"
          [ "${UNVERIFIED_FINDINGS_STATUS}" = error ] || fail "a finding hid an unverifiable revision (status was not error)"
          [ "${UNVERIFIED_FINDINGS_REVISION_CHECK}" = unavailable ] || fail "the finding scan's revision was not unavailable"
          [ -z "${UNVERIFIED_FINDINGS_REVISION}" ] || fail "the finding scan reported a scanned revision"
          [ "${UNVERIFIED_FINDINGS_COUNT}" = 1 ] || fail "the finding was not still shown in the counts"

          # 4. Hostile inputs were only read as data and inherited settings were ignored.
          [ "${HOSTILE_STATUS}" = clean ] || fail "hostile fixtures were not scanned clean"
          [ "${HOSTILE_IGNORED}" -ge 5 ] || fail "hostile inherited settings were not seen and ignored"
          if compgen -G "${WORKSPACE}/fixtures/action-hostile/HOSTILE_*" > /dev/null; then
            fail "a hostile file or setting ran"
          fi
          [ -e "${WORKSPACE}/fixtures/action-hostile/CONTROL_BASH_ENV_RAN" ] || fail "the BASH_ENV control did not run"

      # F-08. The helper is loaded from the downloaded, hash-verified Action directory and its real
      # build() is run against FAKE rustup, rustc and cargo, with a 2 second timeout. No real build runs.
      # The fake cargo starts a child and a grandchild (sleep 3607, killed by the test itself in a
      # finally block) so this checks that a timeout stops the whole process tree. It does not test,
      # and the Action does not claim to stop, a process that starts its own session.
      - name: Verify the build timeout stops the whole process tree (fake build, pinned helper)
        run: |
          set -euo pipefail
          action_dir="$(cd "${RUNNER_WORKSPACE}/../_actions/MergeLatch/mergelatch/${ACTION_SHA}" && pwd -P)"
          ACTION_DIR="${action_dir}" /usr/bin/python3 -I - <<'PY'
          import hashlib, importlib.util, os, shutil, stat, sys, tempfile, time

          action_dir = os.environ["ACTION_DIR"]
          helper_path = os.path.join(action_dir, "action", "mergelatch_action.py")
          with open(helper_path, "rb") as handle:
              if hashlib.sha256(handle.read()).hexdigest() != os.environ["HELPER_SHA256"]:
                  sys.exit("the helper under test is not the verified file")
          spec = importlib.util.spec_from_file_location("pinned_helper", helper_path)
          mla = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mla)

          root = tempfile.mkdtemp(prefix="f08-")
          pids = {}


          def alive(pid):
              try:
                  os.kill(pid, 0)
                  with open("/proc/%d/stat" % pid) as handle:
                      return handle.read().rsplit(")", 1)[1].split()[0] != "Z"
              except OSError:
                  return False


          def fake(path, body):
              with open(path, "w") as handle:
                  handle.write("#!/bin/sh\n" + body)
              os.chmod(path, os.stat(path).st_mode | stat.S_IXUSR)


          def fail(message):
              print("F-08 trial FAILED: " + message)
              raise SystemExit(1)


          def setup(name, cargo_body):
              home = os.path.join(root, name, "home")
              cargo_bin = os.path.join(home, ".cargo", "bin")
              os.makedirs(cargo_bin)
              fake(os.path.join(cargo_bin, "rustup"), "exit 0\n")
              fake(os.path.join(cargo_bin, "rustc"), "echo rustc fake\n")
              fake(os.path.join(cargo_bin, "cargo"), cargo_body)
              action_root = os.path.join(root, name, "action")
              state = os.path.join(root, name, "state")
              os.makedirs(action_root)
              os.makedirs(state)
              env = {"RUNNER_TEMP": os.path.join(root, name), "MLA_ACTION_ROOT": action_root, "MLA_STATE_DIR": state}
              return home, env, state


          try:
              # 1. A timed-out build: cargo, its child and its grandchild must all be stopped.
              marker = os.path.join(root, "tree")
              home, env, state = setup("timeout", (
                  "sleep 3607 &\necho $! > %(m)s.child\n"
                  "( sleep 3607 & echo $! > %(m)s.grandchild; wait ) &\n"
                  "echo $$ > %(m)s.cargo\nwait\n") % {"m": marker})
              mla.BUILD_TIMEOUT_SECONDS = 2
              started = time.monotonic()
              try:
                  mla.build(env, home=home)
              except mla.ActionError as error:
                  message = str(error)
              else:
                  fail("a timed-out build did not raise an error")
              elapsed = time.monotonic() - started
              if "exceeded its time limit" not in message:
                  fail("unexpected timeout message: " + message)
              if elapsed > 30:
                  fail("the timeout took too long (%.1f s)" % elapsed)
              for name in ("cargo", "child", "grandchild"):
                  with open("%s.%s" % (marker, name)) as handle:
                      pids[name] = int(handle.read().split()[0])
              deadline = time.monotonic() + 5
              while any(alive(pid) for pid in pids.values()) and time.monotonic() < deadline:
                  time.sleep(0.05)
              still = [name for name, pid in pids.items() if alive(pid)]
              if still:
                  fail("processes still running after the timeout: " + ", ".join(still))
              try:
                  os.waitpid(-1, os.WNOHANG)
              except ChildProcessError:
                  pass
              else:
                  fail("an unreaped child process was left behind")
              if os.path.exists(os.path.join(state, "binary-path.txt")):
                  fail("a timed-out build left a binary path")
              print("timeout: error raised after %.1f s; cargo, child and grandchild stopped; script reaped" % elapsed)

              # 2. The build runs in its own session and process group.
              home, env, state = setup("group", "awk '{print $5, $6}' /proc/$$/stat > %s.groups\n" % marker)
              mla.BUILD_TIMEOUT_SECONDS = 60
              if mla.build(env, home=home) != 0:
                  fail("the group probe build did not finish")
              with open(marker + ".groups") as handle:
                  pgrp, session = map(int, handle.read().split())
              if pgrp == os.getpgid(0) or session == os.getsid(0):
                  fail("the build shares this process's group or session")
              print("group: build ran in its own process group and session")

              # 3. Normal completion and exit codes are unchanged.
              for code in (0, 1, 101, 127):
                  home, env, state = setup("exit%d" % code, "exit %d\n" % code)
                  mla.BUILD_TIMEOUT_SECONDS = 60
                  got = mla.build(env, home=home)
                  wrote = os.path.exists(os.path.join(state, "binary-path.txt"))
                  if got != code or wrote != (code == 0):
                      fail("exit code %d: returned %r, binary path written: %r" % (code, got, wrote))
              print("exit codes 0, 1, 101, 127 returned exactly; binary path written only on success")
          finally:
              for pid in pids.values():
                  try:
                      os.kill(pid, 9)
                  except OSError:
                      pass
              shutil.rmtree(root, ignore_errors=True)
          print("F-08 trial passed")
          PY
          if pgrep -f "sleep 3607" > /dev/null; then
            echo "::error title=Trial::a fake build process is still running"
            exit 1
          fi
          echo "No fake build process is left running."

      - name: Record what was tested
        if: always()
        run: |
          {
            echo "### SHA-pinned Action trial"
            echo
            echo "The Action was loaded by full commit SHA \`${ACTION_SHA}\` from a separate download directory, not from this checkout. Advisory trial only. Clean results do not prove safety, and this workflow can be edited by the pull request it runs on."
            echo
            echo "Rendering check. GitHub shortens a full SHA written as owner/repo@sha in ordinary text, but not inside a code span."
            echo
            echo "| Form | Rendered |"
            echo "|---|---|"
            echo "| ordinary text | MergeLatch/mergelatch@${ACTION_SHA} |"
            echo "| code span | \`MergeLatch/mergelatch@${ACTION_SHA}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  no-checkout:
    name: SHA-pinned Action without a checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Deliberately no checkout: the Action must fail rather than report an
      # empty directory as clean.
      - name: Run the Action without a checkout (failure expected)
        id: nocheckout
        continue-on-error: true
        uses: MergeLatch/mergelatch@c5296cef5fd3ffc36f1b8f0649e6491050606275

      - name: Check the result
        env:
          OUTCOME: ${{ steps.nocheckout.outcome }}
          STATUS: ${{ steps.nocheckout.outputs.status }}
        run: |
          set -euo pipefail
          [ "${OUTCOME}" = failure ] || { echo "::error title=Trial::a missing checkout did not fail the step"; exit 1; }
          [ "${STATUS}" = error ] || { echo "::error title=Trial::a missing checkout was not reported as an error"; exit 1; }
