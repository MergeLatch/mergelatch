# permissions: write-all
name: "permissions: write-all"
on: pull_request
permissions:
  contents: read
env:
  NOTE: "permissions: write-all"
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Print text
        run: 'echo "permissions: write-all"'
