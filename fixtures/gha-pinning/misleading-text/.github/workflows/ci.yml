# uses: actions/checkout@v4
name: "uses: actions/checkout@v4"
on: pull_request
env:
  NOTE: "uses: actions/checkout@v4"
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: "uses: owner/repo@main"
        run: |
          echo "uses: actions/checkout@v4"
          uses: owner/repo@main
      - run: 'echo uses: owner/repo@v1'
      - uses: ./local-action
        with:
          uses: owner/repo@main
