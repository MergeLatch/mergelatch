[package]
name = "mergelatch-core"
description = "MergeLatch scanning engine and findings model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
yaml-rust2 = "0.13.0"
cap-std = "4.0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "rules"
path = "../../tests/core_rules.rs"

[[test]]
name = "pinning"
path = "../../tests/core_pinning.rs"

[[test]]
name = "confinement"
path = "../../tests/core_confinement.rs"

[[test]]
name = "safety"
path = "../../tests/core_safety.rs"

[lints]
workspace = true
