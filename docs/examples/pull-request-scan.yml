# EXAMPLE ONLY. NOT RUNNABLE YET.
#
# This shows how a public repository could run the MergeLatch advisory scan on
# pull requests once the Action has been reviewed, merged, and released. The
# value of `uses:` below is a placeholder: no reviewed MergeLatch commit exists
# yet, so there is no real SHA to pin. Do not replace it with a branch name or a
# tag. After a release, replace REPLACE_WITH_REVIEWED_40_CHARACTER_COMMIT_SHA
# with the full commit SHA of that reviewed release and nothing else.
#
# This scan is advisory. A pull request can change this workflow file, so the
# result is not a merge gate. See docs/ACTION.md.
name: MergeLatch advisory scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  mergelatch:
    name: MergeLatch advisory scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # By default on pull_request this checks out the merge result of the pull
      # request and the base branch (github.sha). That is the revision the scan
      # reports. To scan the pull request head instead, add
      #   ref: ${{ github.event.pull_request.head.sha }}
      # to `with:`. The scan then describes the head only, not the merge result.
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: MergeLatch advisory scan
        id: mergelatch
        uses: MergeLatch/mergelatch@REPLACE_WITH_REVIEWED_40_CHARACTER_COMMIT_SHA
        # with:
        #   scan-directory: .

      # Optional: read the outputs without ever putting them in a script.
      - name: Show the result
        env:
          STATUS: ${{ steps.mergelatch.outputs.status }}
          FINDINGS: ${{ steps.mergelatch.outputs.findings-count }}
        run: |
          echo "MergeLatch status: ${STATUS} (${FINDINGS} finding(s)). Advisory only."
