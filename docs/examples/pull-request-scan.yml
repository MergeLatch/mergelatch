# EXAMPLE FOR AN ADVISORY TRIAL. NOT A RELEASE, NOT A MERGE GATE.
#
# The commit named in `uses:` below:
#
#   - Source reviewed: afc7e65d6723029c22935f82c7fc9562d5831565, the merge
#     commit of pull request #9 on main.
#   - SHA-pinned trial tested: GitHub downloaded exactly that commit, separately
#     from the checkout being scanned, and ran it in this repository's pull
#     request trial (.github/workflows/action-trial.yml).
#   - Rendered full SHA verified: yes. Its job summary, read on GitHub, shows
#     the complete commit SHA of the Action.
#   - External consumer tested: no. It has been tried in this repository only,
#     not in a separate repository and not from a fork pull request.
#   - Published release: none. MergeLatch has not published a release, and a
#     commit that can be referenced by SHA is not thereby an official release.
#
# Update the SHA only by reviewing a newer commit and replacing the whole
# 40-character value, never by following a branch or tag.
#
# This scan is advisory. A pull request can change this workflow file, so the
# result is not a merge gate and must not be a required check. A green result
# does not mean a pull request is safe; findings and incomplete scans still need
# human review. See docs/ACTION.md.
name: MergeLatch advisory scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  mergelatch:
    name: MergeLatch advisory scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # By default on pull_request this checks out the merge result of the pull
      # request and the base branch (github.sha). That is the revision the scan
      # reports. To scan the pull request head instead, add
      #   ref: ${{ github.event.pull_request.head.sha }}
      # to `with:`. The scan then describes the head only, not the merge result.
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: MergeLatch advisory scan
        id: mergelatch
        uses: MergeLatch/mergelatch@afc7e65d6723029c22935f82c7fc9562d5831565
        # with:
        #   scan-directory: .

      # Optional: read the outputs without ever putting them in a script.
      - name: Show the result
        env:
          STATUS: ${{ steps.mergelatch.outputs.status }}
          FINDINGS: ${{ steps.mergelatch.outputs.findings-count }}
        run: |
          echo "MergeLatch status: ${STATUS} (${FINDINGS} finding(s)). Advisory only."
